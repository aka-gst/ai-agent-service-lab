[project]
name = "ai-agent-service-lab"
version = "0.1.0"
description = "Учебные лабораторные работы по созданию AI-агентов"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
